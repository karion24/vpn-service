<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Karion</title>

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f4f6f8;
            color: #111827;
        }

        .page {
            max-width: 520px;
            margin: 0 auto;
            padding: 28px 18px;
        }

        .card {
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,.06);
        }

        h1 {
            margin-top: 0;
        }

        h2 {
            margin-top: 0;
            font-size: 18px;
        }

        .location {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .location:last-child {
            border-bottom: 0;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            text-align: center;
            text-decoration: none;
            border-radius: 14px;
            background: #111827;
            color: white;
            font-weight: 700;
            box-sizing: border-box;
        }

        .btn.secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .muted {
            color: #6b7280;
        }
    </style>
</head>

<body>
<div class="page">

    <h1>Karion</h1>

    <div class="card">
        <h2>Доступные серверы</h2>

        <p class="muted">
            Karion автоматически выбирает лучший доступный сервер
            и переключается на другой при сбое.
        </p>

        {% for location in locations %}
            <div class="location">
                {{ location.flag }} {{ location.name }}
            </div>
        {% endfor %}
    </div>

    <div class="card">
        <h2>Добавить подписку</h2>

        <p class="muted">
            Выберите режим маршрутизации.
        </p>

        <a href="#" class="btn">
            Полный режим
        </a>

        <a href="#" class="btn secondary">
            Только выбранные ресурсы
        </a>
    </div>

</div>
</body>
</html>
