<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Karion{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
        }

        a {
            color: inherit;
        }

        .topbar {
            background: rgba(255,255,255,.92);
            border-bottom: 1px solid #e5e5ea;
            position: sticky;
            top: 0;
            z-index: 20;
            backdrop-filter: blur(16px);
        }

        .topbar-inner {
            max-width: 1000px;
            margin: 0 auto;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            font-size: 21px;
            font-weight: 750;
            text-decoration: none;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-user {
            color: #6e6e73;
            font-size: 14px;
        }

        .logout-form {
            margin: 0;
        }

        .logout-button {
            border: 0;
            background: #ededf2;
            color: #1d1d1f;
            border-radius: 10px;
            padding: 9px 13px;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
        }

        .page {
            max-width: 1000px;
            margin: 0 auto;
            padding: 38px 20px 60px;
        }

        .auth-page {
            max-width: 520px;
        }

        .card {
            background: #fff;
            border-radius: 22px;
            padding: 26px;
            box-shadow: 0 8px 30px rgba(0,0,0,.06);
            margin-bottom: 18px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
            line-height: 1.15;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 21px;
        }

        .subtitle {
            color: #6e6e73;
            line-height: 1.5;
            margin: 0;
        }

        .form-row {
            margin-top: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            border: 1px solid #d2d2d7;
            border-radius: 13px;
            padding: 14px 15px;
            font: inherit;
            font-size: 16px;
            background: #fff;
            outline: none;
        }

        input:focus {
            border-color: #007aff;
            box-shadow: 0 0 0 3px rgba(0,122,255,.12);
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            text-decoration: none;
            text-align: center;
            padding: 8px 14px;
            min-height: 36px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .button-full {
            display: block;
            width: 100%;
        }

        .button-primary {
            background: #007aff;
            color: #fff;
        }

        .button-secondary {
            background: #ededf2;
            color: #1d1d1f;
        }

        .form-button {
            margin-top: 22px;
        }

        .auth-footer {
            text-align: center;
            color: #6e6e73;
            margin-top: 20px;
        }

        .auth-footer a {
            color: #007aff;
            text-decoration: none;
            font-weight: 600;
        }

        .errorlist {
            list-style: none;
            padding: 0;
            margin: 7px 0 0;
            color: #b42318;
            font-size: 14px;
        }

        .form-errors {
            padding: 14px;
            border-radius: 13px;
            background: #fdecec;
            color: #b42318;
            margin-top: 18px;
        }

        .referral {
            background: #eef5ff;
            color: #2457c5;
            border-radius: 13px;
            padding: 12px 14px;
            margin-top: 18px;
            font-size: 14px;
        }

        .cabinet-header {
            margin-bottom: 26px;
        }

        .subscriptions-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
        }

        .subscription {
            border: 1px solid #e5e5ea;
            border-radius: 17px;
            padding: 20px;
            margin-top: 12px;
        }

        .subscription-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: flex-start;
        }

        .subscription-name {
            font-size: 19px;
            font-weight: 700;
        }

        .subscription-meta {
            margin-top: 8px;
            color: #6e6e73;
            line-height: 1.55;
        }

        .status {
            display: inline-block;
            white-space: nowrap;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: 650;
        }

        .status-active {
            background: #e8f7ec;
            color: #137333;
        }

        .status-disabled {
            background: #fff3cd;
            color: #8a6500;
        }

        .empty {
            text-align: center;
            padding: 34px 15px;
        }

        .empty-icon {
            font-size: 44px;
            margin-bottom: 12px;
        }

        @media (max-width: 640px) {
            .page {
                padding: 24px 14px 45px;
            }

            .card {
                padding: 20px;
                border-radius: 18px;
            }

            h1 {
                font-size: 27px;
            }

            .nav-user {
                display: none;
            }

            .subscriptions-header,
            .subscription-top {
                align-items: stretch;
                flex-direction: column;
            }

            .subscriptions-header .button {
                width: 100%;
            }
        }
    
        @media (max-width: 600px) {

            .device-actions {
                display:flex !important;
                flex-direction:column;
                width:100%;
                gap:10px;
                margin-top:14px;
            }

            .device-actions .button,
            .device-actions button {
                width:100%;
                margin-left:0 !important;
                box-sizing:border-box;
            }

            .device-card {
                padding:14px !important;
            }

        }

        @media (max-width: 600px) {

            .subscription {
                padding:18px !important;
            }


            .subscription-top {
                align-items:flex-start !important;
                gap:10px;
            }


            .status {
                display:inline-flex;
                width:auto !important;
                padding:6px 12px !important;
                font-size:13px;
                border-radius:20px;
            }


            .device-card {
                padding:14px !important;
                border-radius:16px !important;
            }


            .device-actions {
                display:flex !important;
                flex-direction:column;
                gap:10px;
                width:100%;
                margin-top:14px;
            }


            .device-actions .button,
            .device-actions button {
                width:100%;
                margin-left:0 !important;
                min-height:42px;
                justify-content:center;
            }


            .download-button {
                background:#f2f2f7 !important;
                color:#007aff !important;
            }


            .subscription .button-primary {
                min-height:42px;
            }


            .subscription .button-secondary {
                min-height:42px;
            }

        }

        .button-renew {
            background:#eef4ff;
            color:#007aff;
        }

        .button-renew:hover {
            background:#dce9ff;
        }
</style>
</head>

<body>

{% if request.user.is_authenticated %}
<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="{% url 'cabinet' %}">
            ⚡ Karion
        </a>

        <div class="nav">
            <span class="nav-user">
                {{ request.user.email }}
            </span>

            <form
                class="logout-form"
                method="post"
                action="{% url 'logout' %}"
            >
                {% csrf_token %}
                <button
                    class="logout-button"
                    type="submit"
                >
                    Выйти
                </button>
            </form>
        </div>
    </div>
</header>
{% endif %}

{% if messages %}
<div style="
    max-width:1100px;
    margin:16px auto;
    padding:0 16px;
    box-sizing:border-box;
">
    {% for message in messages %}
        <div style="
            padding:14px 16px;
            margin-bottom:10px;
            border-radius:14px;
            background:#fff3cd;
            border:1px solid #ffe69c;
            font-weight:500;
        ">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}

{% block content %}{% endblock %}

</body>
</html>
